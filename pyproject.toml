[project]
name = "krishna"
version = "0.1.0"
description = "Enterprise AI Engineering Cohort Hackathon - AI Interview Agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "pytest>=7.0.0",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
    "groq>=0.9.0",
    "openai>=1.0.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.vercel]
entrypoint = "backend.main:app"
